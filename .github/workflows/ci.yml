name: Testes e publicação segura

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Instalar dependências fixadas
        run: |
          python -m pip install uv==0.13.5
          uv sync --locked --extra test --group audit
      - name: Conferir os arquivos que serão publicados
        run: uv run --no-sync python scripts/check_publication.py --staged
      - name: Testar backend e regras sem API ou livro privado
        run: uv run --no-sync pytest -q
      - name: Testar interface
        run: node --test tests/frontend.test.cjs
      - name: Avaliar a demonstração pública sem API
        run: uv run --no-sync python evaluation/run_demo.py
      - name: Auditar dependências
        run: uv run --no-sync python scripts/check_dependencies.py
