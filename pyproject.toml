[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-rag-assistente"
version = "0.3.0"
description = "Assistente local para consulta verificável de livros de RPG"
requires-python = ">=3.11"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.30,<1",
  "pymupdf>=1.24,<3",
  "groq>=0.31,<1",
  "python-dotenv>=1,<2",
  "langchain-chroma>=1.1,<2",
  "fastembed>=0.9,<1",
  "tokenizers>=0.15,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[dependency-groups]
audit = ["pip-audit==2.10.1"]

[project.scripts]
rpg-assistente = "rpg_assistente.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpg_assistente = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
